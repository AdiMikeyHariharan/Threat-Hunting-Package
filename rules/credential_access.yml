# Credential-access detections modelled on production SOC content
# (Elastic "Potential Password Spraying", Splunk ESCU, SigmaHQ).

id: PWD-SPRAY-0001
title: Password spraying - one source, many distinct accounts
level: high
type: threshold
# Spraying is low-and-slow: few attempts each against MANY users, so it slips
# under a per-account brute-force threshold. We key on distinct users per source.
detection:
  selection:
    program: sshd
    message|contains: "Failed password"
  condition: selection
group_by: src_ip
threshold:
  count: 8
  window_seconds: 300
  distinct: user
mitre:
  - T1110.003
---
id: CRED-STUFF-0001
title: Distributed credential stuffing against a single account
level: high
type: threshold
# The mirror image: ONE account hammered from many different source IPs
# (botnet / proxy-rotated stuffing) - invisible to per-IP rate limits.
detection:
  selection:
    program: sshd
    message|contains: "Failed password"
  condition: selection
group_by: user
threshold:
  count: 10
  window_seconds: 600
  distinct: src_ip
mitre:
  - T1110.004
