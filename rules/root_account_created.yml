id: ROOT-ACCOUNT-0001
title: Root-equivalent (UID=0) local account created
level: critical
type: detection
# A new account with UID=0 is a root-equivalent backdoor - far higher signal
# than an ordinary new user (which NEW-ACCOUNT-0001 flags at medium).
detection:
  selection:
    program|contains: useradd
    message|contains: "new user"
    message|re: "UID=0(?![0-9])"
  condition: selection
mitre:
  - T1136.001
  - T1078.003
